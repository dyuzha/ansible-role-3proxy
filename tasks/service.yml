- name: "service | Install systemd unit"
  ansible.builtin.copy:
    src: 3proxy.service
    dest: /etc/systemd/system/3proxy.service
    owner: proxy3
    group: proxy3
    mode: "644"
  become: true
  notify: "Restart 3proxy service"

- name: "service | Start and enable service"
  ansible.builtin.systemd:
    service: 3proxy
    state: started
    enabled: true
    daemon_reload: true
  become: true
  when: not ansible_check_mode
