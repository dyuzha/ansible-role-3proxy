---
- name: "config | Create work dir"
  ansible.builtin.file:
    path: /etc/3proxy
    state: directory
    owner: proxy3
    group: proxy3
    mode: "600"
  become: true

- name: "config | Generate encrypted passwords"
  ansible.builtin.command:
    cmd: openssl passwd -1 -stdin
    stdin: "{{ client.password }}"
  loop: "{{ proxy3_clients }}"
  loop_control:
    loop_var: client
    label: "{{ client.name }}"
  register: proxy3_encrypted_passwords
  when:
    - proxy3_clients is defined
    - proxy3_clients is iterable
  changed_when: false
  no_log: true

- name: "config | Render config"
  ansible.builtin.template:
    src: 3proxy.cfg.j2
    dest: /etc/3proxy/3proxy.cfg
    owner: proxy3
    group: proxy3
    mode: "600"
  become: true
  notify: "Restart 3proxy service"
